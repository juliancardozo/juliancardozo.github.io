name = "newsletter-api"
main = "index.mjs"
compatibility_date = "2026-08-25"

[vars]
ALLOWED_ORIGINS = "https://juliancardozo.github.io,http://localhost:4321,http://127.0.0.1:4321"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
