<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Open Graph cover</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #faf9f6;
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 64px 80px 56px;
    display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(50rem 26rem at 6% -12%, rgba(11, 95, 88, 0.10), transparent 70%);
  }
  .top { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 44px; height: 44px; border-radius: 11px; background: #0b5f58; color: #fff;
    display: grid; place-items: center; font: 700 15px/1 ui-monospace, Menlo, monospace; letter-spacing: .04em;
  }
  .name { font-size: 20px; font-weight: 620; color: #14171b; letter-spacing: -0.01em; }
  .rule { height: 4px; width: 120px; background: #0b5f58; border-radius: 2px; margin-bottom: 28px; }
  h1 { font-size: 60px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 640; color: #14171b; max-width: 16ch; }
  .sub { font-size: 23px; color: #3d434c; max-width: 46ch; line-height: 1.5; margin-top: 22px; margin-bottom: 18px; }
  .foot { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    font: 400 17px/1 ui-monospace, Menlo, monospace; color: #5f6673;
    border: 1px solid #cfc9bb; border-radius: 999px; padding: 9px 16px;
  }
</style>
</head>
<body>
  <div class="top"><div class="mark">JC</div><div class="name">Julián Cardozo</div></div>
  <div>
    <div class="rule"></div>
    <h1>Convierto problemas reales en productos digitales.</h1>
    <p class="sub">Engineering Manager, desarrollador y product builder. 15+ años entre software, banca, fintech y plataformas.</p>
  </div>
  <div class="foot">
    <span class="chip">Pagos</span><span class="chip">Plataformas</span><span class="chip">APIs</span>
    <span class="chip">Inteligencia artificial</span><span class="chip">Uruguay</span>
  </div>
</body>
</html>
